[project]
name = "sre-agent"
version = "0.1.0"
description = "SRE Agent — Copilote de diagnostic d'incidents GKE (ADK)"
requires-python = "==3.12.*"
dependencies = [
    "google-adk==2.9.2",
    "google-cloud-monitoring==2.31.0",
    "google-api-core==2.34.0",
    "google-auth==2.58.0",
    "google-cloud-logging==3.16.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # Émis par google-adk lui-même (LlmAgentConfig hérite d'une BaseAgentConfig
    # que le package a dépréciée en interne) : rien à corriger côté projet.
    "ignore:BaseAgentConfig is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
