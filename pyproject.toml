[project]
name = "sre-agent"
version = "0.1.0"
description = "SRE Agent — GKE incident diagnosis copilot (ADK)"
requires-python = "==3.12.*"
dependencies = [
    "google-adk==2.9.2",
    "google-cloud-monitoring==2.31.0",
    "google-api-core==2.34.0",
    "google-auth==2.58.0",
    "google-cloud-logging==3.16.3",
]

[dependency-groups]
dev = [
    "google-cloud-aiplatform[adk,agent-engines]==2.2.0",
    "pytest==9.1.1",
    "ruff==0.16.8",
]
slack = [
    "flask==3.1.3",
    "google-cloud-aiplatform[agent-engines]==2.2.0",
    "python-dotenv==1.2.3",
    "slack-bolt==1.30.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
filterwarnings = [
    # Emitted by google-adk itself (LlmAgentConfig inherits from a BaseAgentConfig
    # that the package has deprecated internally): nothing to fix on our side.
    "ignore:BaseAgentConfig is deprecated.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "N", "B"]
