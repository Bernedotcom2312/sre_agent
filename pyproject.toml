[project]
name = "sre-agent"
version = "0.1.0"
description = "SRE Agent — Copilote de diagnostic d'incidents GKE (ADK)"
requires-python = "==3.12.*"
dependencies = [
    "google-adk==2.9.2",
    "google-cloud-monitoring==2.31.0",
    "google-api-core==2.34.0",
    "google-auth==2.58.0",
    "google-cloud-logging==3.16.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
