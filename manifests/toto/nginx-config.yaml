apiVersion: v1
kind: ConfigMap
metadata:
  name: dummy-app-nginx-config
  namespace: toto
data:
  default.conf: |
    server {
        listen 80;
        server_name localhost;
        access_log off;
        error_log /var/log/nginx/error.log warn;

        location / {
            root /usr/share/nginx/html;
            index index.html index.htm;
        }
    }
